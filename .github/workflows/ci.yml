name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Umbrella tag whose spec/ (schemas and fixtures) this builder writes and is tested against.
  UMBRELLA_REF: spec-v0.1.0

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Spec schemas and fixtures from the umbrella repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/UnitcellMD
          ref: ${{ env.UMBRELLA_REF }}
          path: _umbrella
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with Packmol from its PyPI wheel)
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test (spec fixtures and Packmol required)
        run: pytest
        env:
          UCMD_SPEC_DIR: ${{ github.workspace }}/_umbrella/spec
          UCMD_REQUIRE_SPEC: "1"
          UCMD_REQUIRE_PACKMOL: "1"

  gui:
    # The GUI preview (design/B2a.md): Qt and VTK under Xvfb, so the OpenGL view renders too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Spec schemas and fixtures from the umbrella repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/UnitcellMD
          ref: ${{ env.UMBRELLA_REF }}
          path: _umbrella
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: X server, Mesa OpenGL and the libraries Qt's xcb platform needs
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libegl1 libdbus-1-3 \
            libfontconfig1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0
      - name: Install (with the GUI and its test extras)
        run: python -m pip install -e '.[dev,gui-test]'
      - name: GUI tests under Xvfb
        run: xvfb-run -a pytest tests/gui tests/test_gui_core.py -ra
        env:
          UCMD_SPEC_DIR: ${{ github.workspace }}/_umbrella/spec
          UCMD_REQUIRE_SPEC: "1"
          UCMD_REQUIRE_GUI: "1"
          QT_QPA_PLATFORM: xcb

