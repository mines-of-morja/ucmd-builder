format = "ucmd-build"
version = "0.1"
name = "ec-dmc_1-1w_2.0M"
description = "2.0 M LiPF6 in EC:DMC 1:1 (w); counts: estimate (calibrated on Lehnert EC:EMC)"
seed = 20261116
component = [
    { name = "Li", molecule = { library = "Li" }, count = 85 },
    { name = "PF6", molecule = { library = "PF6" }, count = 85 },
    { name = "EC", molecule = { library = "EC" }, count = 253 },
    { name = "DMC", molecule = { smiles = "COC(=O)OC" }, count = 247 },
]

[forcefield]
source = "library"
set = "opls-aa-carbonates"

[box]
length_nm = 4.13

[packing]
