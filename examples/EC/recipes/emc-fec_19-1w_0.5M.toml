    { name = "PF6", molecule = { library = "PF6" }, count = 26 },
    { name = "EMC", molecule = { library = "EMC" }, count = 475 },
    { name = "FEC", molecule = { smiles = "O=C1OCC(F)O1" }, count = 25 },
