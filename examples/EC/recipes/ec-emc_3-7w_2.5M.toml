# 2.5 M LiPF6 in EC:EMC 3:7 (w): 7732 atoms.
# Counts: Lehnert2025 SI Table S1. Box edge: approximate initial box from the author's table
# (examples/EC/boxes.csv); the density comes from NPT later.
# Ion charge scale ζ = 0.75 (Lehnert 2025, SI Table S3).
# Build:  ucmd-build build examples/EC/recipes/ec-emc_3-7w_2.5M.toml -o ec-emc_3-7w_2.5M.ucsys
format = "ucmd-build"
version = "0.1"
name = "ec-emc_3-7w_2.5M"
description = "2.5 M LiPF6 in EC:EMC 3:7 (w); counts: Lehnert2025 SI Table S1"
seed = 20261116
component = [
    { name = "Li", molecule = { library = "Li" }, count = 134, charge_scale = 0.75 },
    { name = "PF6", molecule = { library = "PF6" }, count = 134, charge_scale = 0.75 },
    { name = "EC", molecule = { library = "EC" }, count = 168 },
    { name = "EMC", molecule = { library = "EMC" }, count = 332 },
]

[forcefield]
source = "library"
set = "opls-aa-carbonates"

[box]
length_nm = 4.46

[packing]
method = "packmol"
tolerance_nm = 0.2
